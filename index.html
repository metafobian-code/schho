<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>La entropía está en el requestAnimationFrame</title>
<style>
:root{color-scheme:dark;--bg:#04090b}
html,body{margin:0;height:100%;background:var(--bg);overflow:hidden}
canvas{display:block;width:100%;height:100%;cursor:pointer}
</style></head><body><canvas id="c"></canvas>
<script>
const S=[
["La entropía está en el","requestAnimationFrame"],
["Tantas impresiones,","ni una sola idea:","no basta que algo nos alcance","para que llegue a distinguirse."],
["La vida no es una fuerza nueva,","sino otra clase de orden:","uno que se transmite","y se reorganiza sin permanecer intacto."],
["Entran átomos, salen átomos,","y ninguno lleva escrito","el nombre de quien lo incorpora.","Lo que dura es la organización,","y ese “mientras puede” tiene un precio:","vivir es exportar desorden,","pagar con entropía","la persistencia de la forma."],
["No eres la misma materia","que hace diez años,","sino un orden que persiste","a través de sus intercambios."],
["Toda forma es también clausura:","ser algo es no poder ser cualquier cosa.","Su estabilidad","es la suma de sus negativas."],
["Así el conocimiento:","no acumula el mundo,","encuentra diferencias,","hace posible una figura.","Y el que conoce es materia organizada","que llega a reconocer otras formas."],
["Quizá el umbral entre materia, vida y conocimiento","no sea una frontera entre sustancias,","sino el problema de la forma:","cómo un orden persiste","y llega a preguntarse","qué ha tenido que dejar de ser","para persistir."]
];
const FONT='ui-monospace,"SF Mono",Menlo,Consolas,monospace',GL="01░▒▓#@$%&*+=<>?/\\|[]{}~^";
const OS=S.slice(1).flat().join(' ').toLowerCase().replace(/[“”:,.]/g,'').replace(/\s+/g,' ')+' ',L=OS.length;
const cv=document.getElementById('c'),g=cv.getContext('2d');
let W,H,fs,cw,lh,ofs,ocw,olh,rows,cols,waterY,h,v,ovCh,ovL,ovs=[],parts=[],nx=null,Tn=0,cur=0,sc,T=0,tt=0,phase=0,gapEnd=0,paused=false;

function size(){
  const dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
  cv.width=W*dpr;cv.height=H*dpr;g.setTransform(dpr,0,0,dpr,0,0);
  ofs=Math.max(9,Math.min(13,W/60));g.font=ofs+'px '+FONT;ocw=g.measureText('M').width;olh=ofs*1.05;
  rows=Math.max(5,Math.round(H*.2/olh));cols=Math.ceil(W/ocw)+1;waterY=H-rows*olh-ofs*.5;
  h=new Float32Array(cols);v=new Float32Array(cols);ovCh=new Array(cols);ovL=new Float32Array(cols);
  let mc=0,ml=0;S.forEach(s=>{ml=Math.max(ml,s.length);s.forEach(l=>mc=Math.max(mc,l.length))});
  fs=Math.max(8,Math.min(26,W*.92/(mc*.602),(waterY-H*.06)/(ml*1.75)));
  g.font=fs+'px '+FONT;cw=g.measureText('M').width;lh=fs*1.75;start(cur);
}
function build(i){
  const s=S[i],n=s.length,y0=(waterY-n*lh)/2+lh/2-fs*.3,ws=[];let mr=0;
  s.forEach((l,li)=>{const x0=(W-l.length*cw)/2,re=/\S+/g;let m;
    while(m=re.exec(l)){const cs=[];
      for(let k=0;k<m[0].length;k++){const ts=Math.random()*1.1+li*.08,dur=1.5+Math.random()*.7,r=ts+dur;mr=Math.max(mr,r);
        cs.push({ch:m[0][k],x:x0+(m.index+k)*cw,r,ts,dur,dep:false,sx:Math.max(0,Math.min(W,x0+(m.index+k)*cw+(Math.random()-.5)*W*.25)),sy:waterY+Math.random()*(H-waterY),id:(Math.random()*1e5)|0})}
      ws.push({cs,y:y0+li*lh,dy:0,vy:0,t0:0,li,fall:false,done:false,cx:x0+(m.index+m[0].length/2)*cw})}});
  return{ws,hold:mr+1.2+ws.length*.22};
}
function start(i){cur=i;nx=null;sc=build(i);T=0;phase=0}
function splash(c,n){const a=Math.min(26,4+n*1.6)*ofs/11;
  for(let j=-9;j<=9;j++){const k=c+j;if(k>0&&k<cols-1)v[k]+=a*Math.exp(-j*j/14)}}
const amb=(c,r)=>Math.sin(c*.22+tt*1.1+r*.4)*ofs*.32+Math.sin(c*.55-tt*1.7)*ofs*.14;

function update(dt){
  tt+=dt;T+=dt;if(nx)Tn+=dt;
  for(const [q,t] of [[sc,T],[nx,Tn]])if(q)for(const w of q.ws)for(const c of w.cs)if(!c.dep&&t>=c.ts){c.dep=true;const k=Math.max(1,Math.min(cols-2,(c.sx/ocw)|0));v[k]-=ofs*.12}
  for(let s=0;s<2;s++){
    for(let i=1;i<cols-1;i++)v[i]+=(h[i-1]+h[i+1]-2*h[i])*.3-.002*h[i];
    for(let i=1;i<cols-1;i++){v[i]*=.99;h[i]=Math.max(-ofs*3,Math.min(ofs*3,h[i]+v[i]))}
    h[0]=h[1];h[cols-1]=h[cols-2];
  }
  for(const o of ovs)o.life-=dt;ovs=ovs.filter(o=>o.life>0);
  for(const p of parts){p.vy+=H*1.1*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt}
  parts=parts.filter(p=>p.life>0&&p.y<waterY+ofs*3);
  if(phase===0&&T>=sc.hold){phase=1;sc.ws.forEach(w=>w.t0=T+Math.random()*1.4+w.li*.18);nx=build((cur+1)%S.length);Tn=-.4}
  else if(phase===1){
    let all=true;
    for(const w of sc.ws){if(w.done)continue;all=false;if(T<w.t0)continue;
      w.fall=true;w.vy+=H*1.1*dt;w.dy+=w.vy*dt;
      const col=Math.max(0,Math.min(cols-1,(w.cx/ocw)|0));
      if(w.y+w.dy+fs*.5>=waterY+h[col]){w.done=true;splash(col,w.cs.length);
        for(const c of w.cs)parts.push({x:c.x,y:waterY+h[col],vx:(Math.random()-.5)*90,vy:-H*(.25+Math.random()*.45),ch:c.ch,life:1+Math.random()*.5});
        ovs.push({x:w.cx-w.cs.length*ocw*.35,s:w.cs.map(c=>c.ch).join('').toLowerCase(),life:2.8});}}
    if(all){const m=(cur+1)%S.length;sc=nx;T=Tn;cur=m;nx=null;phase=0}
  }else if(phase===2&&T>=gapEnd)start((cur+1)%S.length);
}
function draw(){
  g.clearRect(0,0,W,H);g.textBaseline='middle';g.textAlign='left';
  g.font=fs+'px '+FONT;g.shadowColor='#ffc800';g.shadowBlur=fs*.6;
  const sw=((tt*.22)%1.5)-.25;
  const dsc=(sc,T,phase)=>{for(const w of sc.ws){if(w.done)continue;
    for(const c of w.cs){let ch,fill,px=c.x,py=w.y;
      if(phase===0&&T<c.r){if(T<c.ts)continue;const p=Math.min(1,(T-c.ts)/c.dur),e=p*p*(3-2*p);px=c.sx+(c.x-c.sx)*e+Math.sin(p*9+c.id)*14*(1-p);py=c.sy+(w.y-c.sy)*e;ch=GL[((Math.floor(tt*16)+c.id)*2654435761>>>0)%GL.length];fill=`rgba(230,180,50,${.3+.5*p})`}
      else{const age=phase===0?T-c.r:9,f=age<.35?1-age/.35:0,d=c.x/W-sw,
        k=Math.min(1,f+Math.exp(-d*d*60)*.7),sh=.82+.18*Math.sin(tt*2.2+c.x*.03);
        ch=c.ch;fill=`rgba(255,${215+40*k|0},${120+120*k|0},${Math.min(1,sh)})`}
      g.fillStyle=fill;
      g.fillText(ch,px+(w.fall?Math.sin(tt*9+c.id)*Math.min(1.5,w.vy/150):0),py+w.dy)}}};dsc(sc,T,phase);if(nx)dsc(nx,Tn,0);
  g.shadowBlur=0;g.font=ofs+'px '+FONT;
  const gr=g.createLinearGradient(0,waterY,0,H);
  gr.addColorStop(0,'rgba(160,110,0,.14)');gr.addColorStop(1,'rgba(60,40,0,.42)');
  g.fillStyle=gr;g.fillRect(0,waterY,W,H-waterY);
  let yy=waterY;
  for(let r=0;r<rows;r++){
    const s=.8+.4*r/Math.max(1,rows-1),rh=olh*s,cwr=ocw*s,n=Math.ceil(W/cwr)+1,dir=r%2?1:-1,off=Math.floor(tt*(1.5+r*.6)*(.6+s*.5))*dir;
    g.font=(ofs*s)+'px '+FONT;yy+=rh/2;
    for(let c=0;c<n;c++){
      const x=c*cwr;
      if(r===1&&ovs.some(o=>x>=o.x&&x<o.x+o.s.length*cwr))continue;
      const ch=OS[(((c+r*29+off)%L)+L)%L];
      if(ch===' ')continue;
      const bc=Math.min(cols-1,(x/ocw)|0),a0=amb(x/ocw,r),hh=h[bc],disp=(a0+hh)*s;
      const k=Math.max(0,Math.min(1,-(a0+hh)/(ofs*.6)))*(.6+.4*s/1.2),al=.45+.45*s/1.2;
      g.fillStyle=`rgba(${190+65*k|0},${140+100*k|0},${30+140*k|0},${Math.min(1,al+.2*k)})`;
      g.fillText(ch,x,yy+disp)}
    if(r===1)for(const o of ovs){g.fillStyle=`rgba(255,240,170,${Math.min(1,o.life)})`;
      for(let k=0;k<o.s.length;k++){const x=o.x+k*cwr,bc=Math.max(0,Math.min(cols-1,(x/ocw)|0));g.fillText(o.s[k],x,yy+(amb(x/ocw,r)+h[bc])*s)}}
    yy+=rh/2}
  g.font=(fs*.8)+'px '+FONT;g.shadowColor='#ffc800';g.shadowBlur=8;
  for(const p of parts){g.fillStyle=`rgba(255,235,150,${Math.min(1,p.life)})`;g.fillText(p.ch,p.x,p.y)}
  g.shadowBlur=0;
}
let last=performance.now();
function frame(n){const dt=Math.min(.05,(n-last)/1000);last=n;if(!paused)update(dt);draw();requestAnimationFrame(frame)}
addEventListener('resize',size);
addEventListener('keydown',e=>{if(e.code==='Space'){paused=!paused;e.preventDefault()}});
cv.addEventListener('click',()=>{
  if(phase===0){T=sc.hold}else if(phase===2){T=gapEnd}});
size();requestAnimationFrame(frame);
</script></body></html>
